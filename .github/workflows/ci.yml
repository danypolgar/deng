name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit + SQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polymarket"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_PG_ADMIN_DSN: host=localhost port=5432 user=polymarket password=ci-only-password dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements.lock
            ingestion/requirements-dev.txt
      - run: pip install -r ingestion/requirements-dev.txt
      - name: pytest
        working-directory: ingestion
        run: python -m pytest -v -rs

  docker:
    name: Docker image + compose stack tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ingestion/Dockerfile
      - run: docker compose config --quiet
      - run: docker compose build pipeline
      - name: CLI starts inside the image
        run: docker run --rm deng-pipeline:latest python -m polymarket_pipeline --help
      - name: Tests in the compose stack (same command as README 7.8)
        run: docker compose run --rm test
      - if: always()
        run: docker compose --profile test down -v
